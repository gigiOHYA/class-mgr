<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五年級的社會兵團</title>
<style>
  :root{
    --bg:#f4f1e8;
    --card:#ffffff;
    --ink:#33302a;
    --muted:#8a8478;
    --accent:#e8632c;
    --accent-dark:#c74f1f;
    --good:#4c8c6b;
    --bad:#c1443c;
    --line:#e6e0d3;
    --gold:#e2b33c;
    --silver:#b8bcc4;
    --bronze:#c98a4f;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:transparent;
    color:var(--ink);
    padding-bottom:60px;
    min-height:100%;
  }
  #bgLayer{
    position:fixed;
    inset:-60px;
    z-index:-1;
    background-size:cover;
    background-position:center;
    filter:blur(8px) saturate(1.05);
    transition:background-image .5s ease;
  }
  #bgLayer::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(244,241,232,.78);
  }
  header{
    padding:20px 16px 10px;
    text-align:center;
  }
  header h1{
    margin:0 0 4px;
    font-size:22px;
    letter-spacing:1px;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }
  .tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    padding:14px 16px 4px;
  }
  .tab-btn{
    border:2px solid var(--line);
    background:var(--card);
    border-radius:999px;
    padding:8px 18px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition:all .15s;
  }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  main{
    max-width:920px;
    margin:0 auto;
    padding:12px 16px;
  }
  .era-card{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    color:#fff;
    min-height:180px;
    display:flex;
    align-items:flex-end;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
    margin-bottom:16px;
    background-size:cover;
    background-position:center;
  }
  .era-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(20,15,10,.82) 0%, rgba(20,15,10,.35) 55%, rgba(20,15,10,.05) 100%);
  }
  .era-card .era-inner{
    position:relative;
    width:100%;
    padding:16px 18px;
  }
  .era-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .era-level-badge{
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.4);
    backdrop-filter:blur(4px);
    padding:4px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
  }
  .era-total{
    font-size:13px;
    opacity:.9;
  }
  .era-name{
    font-size:24px;
    font-weight:800;
    margin:10px 0 6px;
    text-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .era-period{
    font-size:13px;
    font-weight:700;
    opacity:.9;
    margin:-2px 0 6px;
  }
  .era-desc{
    font-size:13px;
    line-height:1.6;
    opacity:.92;
    margin-bottom:10px;
    text-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .era-progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
  }
  .era-progress-bar{
    flex:1;
    height:10px;
    background:rgba(255,255,255,.25);
    border-radius:999px;
    overflow:hidden;
  }
  .era-progress-fill{
    height:100%;
    background:linear-gradient(90deg,#ffd76a,#e8632c);
    border-radius:999px;
    transition:width .4s;
  }
  .era-next{
    opacity:.85;
    white-space:nowrap;
  }
  .era-maxed{
    font-size:12px;
    background:var(--gold);
    color:#4a3400;
    padding:2px 10px;
    border-radius:999px;
    font-weight:700;
    display:inline-block;
    margin-top:4px;
  }

  .section-title{
    font-size:15px;
    font-weight:700;
    margin:18px 0 8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .bonus-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    -webkit-overflow-scrolling:touch;
  }
  .bonus-btn{
    flex:0 0 auto;
    border:none;
    border-radius:12px;
    padding:10px 14px;
    font-size:13px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,.12);
  }
  .bonus-btn.good{background:var(--good);}
  .bonus-btn.bad{background:var(--bad);}

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:18px 0 8px;
  }
  .sort-toggle{
    display:flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
    font-size:12px;
  }
  .sort-toggle button{
    border:none;
    background:transparent;
    padding:6px 12px;
    cursor:pointer;
    color:var(--muted);
    font-weight:600;
  }
  .sort-toggle button.active{
    background:var(--accent);
    color:#fff;
  }

  .student-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
  }
  .student-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    cursor:pointer;
    transition:transform .1s;
    position:relative;
  }
  .student-card:active{transform:scale(.97);}
  .student-card .medal{
    position:absolute;
    top:8px;
    right:8px;
    font-size:16px;
  }
  .student-card .seat-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:32px;
    height:32px;
    padding:0 6px;
    border-radius:16px;
    background:var(--ink);
    color:#fff;
    font-size:15px;
    font-weight:800;
    margin-bottom:8px;
  }
  .student-card .name{
    font-size:15px;
    font-weight:700;
    margin:0 0 8px;
  }
  .student-card .score{
    font-size:26px;
    font-weight:800;
    color:var(--accent-dark);
  }
  .student-card .score-label{
    font-size:11px;
    color:var(--muted);
    margin-left:2px;
  }

  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(20,15,10,.5);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--bg);
    width:100%;
    max-width:520px;
    max-height:85vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:18px 18px 28px;
  }
  @media (min-width:600px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:20px;}
  }
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .modal-head h2{
    margin:0;
    font-size:19px;
  }
  .modal-head .close-btn{
    border:none;
    background:var(--line);
    width:30px;
    height:30px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    color:var(--ink);
  }
  .modal-score{
    text-align:center;
    margin:6px 0 18px;
  }
  .modal-score .num{
    font-size:44px;
    font-weight:800;
    color:var(--accent-dark);
  }
  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:18px;
  }
  .cat-btn{
    border:none;
    border-radius:12px;
    padding:12px 10px;
    font-size:14px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    text-align:left;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .cat-btn.good{background:var(--good);}
  .cat-btn.bad{background:var(--bad);}
  .cat-btn .pts{font-size:13px; opacity:.85;}

  .bulk-hint{
    font-size:13px;
    color:var(--muted);
    margin:0 0 12px;
  }
  .bulk-toolbar{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .bulk-toolbar button{
    flex:1;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    border-radius:10px;
    padding:8px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .exclude-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(64px,1fr));
    gap:8px;
    margin-bottom:18px;
  }
  .exclude-chip{
    border:2px solid var(--line);
    border-radius:12px;
    padding:8px 4px;
    text-align:center;
    cursor:pointer;
    background:var(--card);
    user-select:none;
    transition:all .15s;
  }
  .exclude-chip .seat{
    font-weight:800;
    font-size:15px;
  }
  .exclude-chip .name{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .exclude-chip.excluded{
    border-color:var(--bad);
    background:rgba(193,68,60,.08);
    opacity:.55;
  }
  .exclude-chip.excluded .seat{
    text-decoration:line-through;
    color:var(--bad);
  }
  .bulk-confirm-row{
    display:flex;
    gap:10px;
  }
  .bulk-confirm-row button{
    flex:1;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .bulk-confirm-row .cancel-btn{
    background:var(--line);
    color:var(--ink);
  }
  .bulk-confirm-row .apply-btn{
    background:var(--accent);
    color:#fff;
  }

  .participation-note{
    font-size:12px;
    color:var(--muted);
    margin:-6px 0 10px;
  }
  .participation-empty{
    font-size:13px;
    color:var(--good);
    padding:2px 0 18px;
  }
  .participation-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(64px,1fr));
    gap:8px;
    margin-bottom:18px;
  }
  .participation-chip{
    border:2px solid var(--accent);
    border-radius:12px;
    padding:8px 4px;
    text-align:center;
    cursor:pointer;
    background:rgba(232,99,44,.08);
  }
  .participation-chip .seat{
    font-weight:800;
    font-size:15px;
    color:var(--accent-dark);
  }
  .participation-chip .name{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .history-list{
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .history-list h3{
    font-size:13px;
    color:var(--muted);
    margin:0 0 8px;
  }
  .history-item{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
  }
  .history-item .cat{font-weight:600;}
  .history-item .pt.good{color:var(--good); font-weight:700;}
  .history-item .pt.bad{color:var(--bad); font-weight:700;}
  .history-empty{
    font-size:13px;
    color:var(--muted);
    padding:8px 0;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .25s;
    z-index:60;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .loading, .empty{
    text-align:center;
    color:var(--muted);
    padding:40px 0;
    font-size:14px;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:20px 0 4px;
  }
</style>
</head>
<body>

<div id="bgLayer"></div>

<header>
  <h1>🛡️ 五年級的社會兵團</h1>
  <p>班級積分系統・台灣時代升級之旅</p>
</header>

<div class="tabs" id="classTabs"></div>

<main>
  <div id="content" class="loading">載入中…</div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<div class="toast" id="toast"></div>

<footer>五年級的社會兵團 · 資料每次操作即時更新</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzXXRYVb8Xwm9kY2HUpykGnMktss2MjDom-pigwFzdtPY3tvbvXu09xPl0-XCwN0CniyQ/exec";
const CLASSES = ["506","507","508","509","510","demo"];

// Era content from the 時代內容 Google Sheet (Lv, 時代名稱, 時間區間, 背景簡介).
const ERAS = [
  {name:"舊石器史前時代", period:"約5萬年前 ～ 6,000年前", desc:"文字記錄出現前，長濱文化等先民已在台灣活動，利用天然洞穴棲息，以打製石器採集與漁獵，為台灣已知最古老的人類文化。"},
  {name:"新石器與南島擴散時代", period:"約6,000年前 ～ 2,000年前", desc:"大坌坑、卑南等新石器文化興起，發展磨製石器、農業與精緻陶器。台灣成為南島語族擴散源頭之一，先民揚帆移居太平洋各群島。"},
  {name:"鐵器與原民部落時代", period:"約2,000年前 ～ 16世紀", desc:"出現十三行等金屬器文化，能煉鐵並與外地廣泛貿易。平埔族與高山各原住民族發展出成熟的部落組織、獵場規則與歲時祭儀。"},
  {name:"大航海與荷西競合時代", period:"1624年 ～ 1662年", desc:"台灣位處東亞航線要衝，荷蘭東印度公司於南台灣建熱蘭遮城，西班牙進駐北台灣基隆、淡水；1642年荷蘭驅逐西班牙，確立在台貿易霸權。"},
  {name:"明鄭東寧王國時代", period:"1662年 ～ 1683年", desc:"鄭成功驅逐荷蘭人建立政權，引進屯田制度、開拓荒地以安頓軍民，並在台南興建全台首座孔廟，正式導入儒學文教體系。"},
  {name:"清領渡海拓墾時代", period:"1683年 ～ 1780年代", desc:"清朝將台灣納入版圖，大量福建與廣東移民渡海拓墾，陸續修築八堡圳、瑠公圳等大規模水利設施，逐步形成成熟的漢人農業聚落。"},
  {name:"移民社會與族群碰撞時代", period:"1780年代 ～ 1850年代", desc:"隨著土地開墾飽和與資源競爭，爆發林爽文事件等抗官民變，閩粵客家與漳泉族群間頻發械鬥，促成民間信仰圈與自衛義民組織的強化。"},
  {name:"開港通商與洋行時代", period:"1860年代 ～ 1874年", desc:"依約開放安平、淡水、打狗與基隆通商，外商洋行紛紛進駐，茶葉與樟腦大量出口，全島經濟重心自此逐漸由南向北轉移。"},
  {name:"晚清開山撫番與近代化", period:"1874年 ～ 1895年", desc:"牡丹社事件促使清廷轉為積極治理，沈葆楨闢建東西聯絡道；劉銘傳任巡撫期間推動新政，鋪設第一條官辦鐵路並架設電報線。"},
  {name:"日治領台與土地現代化", period:"1895年 ～ 1908年", desc:"日本領台後鎮壓武裝抗日，推行全島土地調查、戶口普查與度量衡統一；1908年縱貫鐵路全線通車，奠定全島一日生活圈基石。"},
  {name:"日治糖業與工業萌芽時代", period:"1908年 ～ 1920年代", desc:"現代化新式製糖廠紛紛設立，遍布中南部的「五分車」鐵道帶動經濟，使台灣贏得「糖業王國」稱譽，自此踏上早期加工工業化腳步。"},
  {name:"大正民主與文協啟蒙時代", period:"1920年代 ～ 1930年代", desc:"受到自決思潮影響，蔣渭水與林獻堂等人成立台灣文化協會、推動台灣議會設置請願運動，發表刊物並巡迴演講，本土社會運動全面啟蒙。"},
  {name:"水利基建與水力發電時代", period:"1930年 ～ 1937年", desc:"八田與一主導完成當時亞洲規模最大的嘉南大圳，大幅改善農業產能；日月潭水力發電所完工，為全島輕重工業提供穩定電力動能。"},
  {name:"戰時體制與皇民化時代", period:"1937年 ～ 1945年", desc:"二戰爆發後日本政府實施「皇民化運動」，強制推行日語、改換日本姓名及參拜神社，並實施物資配給、徵調台籍青年投入太平洋戰事。"},
  {name:"戰後接收與動盪時代", period:"1945年 ～ 1947年", desc:"1945年日本戰敗，中華民國政府接收台灣。因政權移轉失調、物價惡性膨脹與文化隔閡，1947年爆發二二八事件，全島社會遭受深遠重創。"},
  {name:"政府遷台與戒嚴時代", period:"1949年 ～ 1950年代初", desc:"國共內戰局勢逆轉，中央政府於1949年遷台，近兩百萬軍民撤退移入；同年頒布全島戒嚴令，軍警治安力量高度強化，進入威權體制。"},
  {name:"土地改革與冷戰美援時代", period:"1950年代", desc:"韓戰爆發後台美簽署共同防禦條約，大量美援物資挹注；島內推行「三七五減租」與「耕者有其田」，重組農村社會並為工業化累積資本。"},
  {name:"加工出口區與輕工業時代", period:"1960年代", desc:"高雄設立全台首座加工出口區，推動紡織、塑膠及電子組裝等出口導向產業，吸引大量農村女性勞動力進城，「客廳即工廠」蔚為風潮。"},
  {name:"十大建設與重工業時代", period:"1970年代", desc:"面臨退出聯合國與國際石油危機，政府啟動十大建設，完成南北高速公路、中正國際機場、大煉鋼廠及石化工業園區，奠定厚實工業基礎。"},
  {name:"科學園區與電子起飛時代", period:"1980年 ～ 1987年", desc:"1980年新竹科學園區成立，引進海內外科技人才發展電腦及周邊硬體零組件；1987年台積電創設，開啟晶圓代工全新商業模式。"},
  {name:"解除戒嚴與社會運動時代", period:"1987年 ～ 1991年", desc:"1987年宣告解除長達38年的戒嚴令，開放黨禁與報禁。農民運動、勞工運動與野百合學運接連爆發，促成國會全面改選與終止動員戡亂。"},

function eraImage(level){
  const n = String(level).padStart(2,"0");
  return "images/" + n + ".jpg";
}
function eraInfo(level){
  return ERAS[Math.min(Math.max(level,1),ERAS.length) - 1];
}
function eraName(level){
  return eraInfo(level).name;
}

const DAILY_BASELINE = 0;
const PARTICIPATION_CATEGORY = "主動發言";
// Categories added on the frontend in case the backend's category sheet
// doesn't have them yet. Inserted after the last positive category.
const EXTRA_CATEGORIES = [{name:"幫助同學", points:1}];
// Class-wide "good order" bonus comes in three tiers; individual students
// still get the category's default points.
const ORDER_CATEGORY = "秩序良好";
const ORDER_TIERS = [
  {stars:"★", points:1},
  {stars:"★★", points:2},
  {stars:"★★★", points:3},
];
let STATE = null;
let currentClass = CLASSES[0];
let sortMode = "seat"; // or "score"
let modalStudent = null;
let bulkModal = null; // {category, points, excluded: Set<number>}

async function loadState(){
  try{
    const res = await fetch(API_URL + "?action=state");
    STATE = await res.json();
    mergeExtraCategories();
    render();
  }catch(err){
    document.getElementById("content").innerHTML =
      '<div class="empty">⚠️ 無法連線到後端，請檢查網路後重新整理。</div>';
    console.error(err);
  }
}

function mergeExtraCategories(){
  const cats = STATE.categories = STATE.categories || [];
  EXTRA_CATEGORIES.forEach(extra => {
    if(cats.some(c => c.name === extra.name)) return;
    let idx = cats.length;
    for(let i = cats.length - 1; i >= 0; i--){
      if(cats[i].points > 0){ idx = i + 1; break; }
    }
    cats.splice(idx, 0, {...extra});
  });
}

function dateKeyTaipei(d){
  // Asia/Taipei y-m-d key, matching backend's daily boundary.
  // Accepts a Date, or anything Date() can parse (the backend's record
  // timestamps aren't always strict ISO strings, so always go through
  // `new Date(...)` rather than string-slicing).
  const dateObj = d instanceof Date ? d : new Date(d);
  const tpe = new Date(dateObj.toLocaleString("en-US",{timeZone:"Asia/Taipei"}));
  const y = tpe.getFullYear();
  const m = String(tpe.getMonth()+1).padStart(2,"0");
  const day = String(tpe.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function todayStr(){
  return dateKeyTaipei(new Date());
}

function renderTabs(){
  const wrap = document.getElementById("classTabs");
  wrap.innerHTML = "";
  CLASSES.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (c === currentClass ? " active" : "");
    btn.textContent = c + " 班";
    btn.onclick = () => { currentClass = c; render(); };
    wrap.appendChild(btn);
  });
}

function getRecentLessonDates(className, n){
  // "一堂課" isn't tracked explicitly — we treat each distinct calendar
  // day (Asia/Taipei) that has any record for the class as one lesson.
  const dateSet = new Set();
  (STATE.records || []).forEach(r => {
    if(r.className === className) dateSet.add(dateKeyTaipei(r.time));
  });
  return Array.from(dateSet).sort((a,b) => b.localeCompare(a)).slice(0, n);
}

function getNoParticipationSeats(className){
  const lessonDates = getRecentLessonDates(className, 3);
  if(lessonDates.length === 0) return {lessonDates, seats: []};
  const lessonDateSet = new Set(lessonDates);
  const participated = new Set();
  (STATE.records || []).forEach(r => {
    if(r.className === className && r.category === PARTICIPATION_CATEGORY && lessonDateSet.has(dateKeyTaipei(r.time))){
      participated.add(Number(r.seat));
    }
  });
  const students = (STATE.students || []).filter(s => s.className === className);
  const seats = students.filter(s => !participated.has(Number(s.seat))).sort((a,b) => a.seat - b.seat);
  return {lessonDates, seats};
}

function setBackground(level){
  const bg = document.getElementById("bgLayer");
  const url = eraImage(level);
  if(bg.dataset.url !== url){
    bg.style.backgroundImage = `url('${url}')`;
    bg.dataset.url = url;
  }
}

function render(){
  renderTabs();
  if(!STATE) return;
  const content = document.getElementById("content");
  content.className = "";

  const cl = (STATE.classLevels || []).find(c => c.className === currentClass) ||
    {total:0, level:1, progress:0, pointsPerLevel:20, maxLevel:20};
  setBackground(cl.level);
  const students = (STATE.students || []).filter(s => s.className === currentClass);
  const scoreMap = {};
  (STATE.scores || []).filter(s => s.className === currentClass).forEach(s => {
    scoreMap[s.seat] = s.score;
  });
  const categories = STATE.categories || [];

  const isMax = cl.level >= cl.maxLevel;
  const nextName = isMax ? null : eraName(cl.level + 1);

  let html = "";

  html += `<div class="era-card" style="background-image:url('${eraImage(cl.level)}')">
    <div class="era-inner">
      <div class="era-top">
        <div class="era-level-badge">Lv.${cl.level} / ${cl.maxLevel}</div>
        <div class="era-total">班級累積總分：<strong>${cl.total}</strong> 分</div>
      </div>
      <div class="era-name">${eraName(cl.level)}</div>
      <div class="era-period">${eraInfo(cl.level).period}</div>
      <div class="era-desc">${eraInfo(cl.level).desc}</div>
      ${ isMax
        ? `<div class="era-maxed">🏆 已達最高時代！</div>`
        : `<div class="era-progress-row">
             <div class="era-progress-bar"><div class="era-progress-fill" style="width:${Math.min(100, cl.progress / cl.pointsPerLevel * 100)}%"></div></div>
             <div class="era-next">${cl.progress}/${cl.pointsPerLevel} 分 → ${nextName}</div>
           </div>`
      }
    </div>
  </div>`;

  html += `<div class="section-title">✨ 全班加減分</div>
  <div class="bonus-row">`;
  categories.forEach(cat => {
    if(cat.name === ORDER_CATEGORY){
      ORDER_TIERS.forEach(tier => {
        html += `<button class="bonus-btn good" onclick="openBulkModal('${escapeAttr(cat.name)}', ${tier.points})">
          ${cat.name} ${tier.stars} +${tier.points}
        </button>`;
      });
      return;
    }
    const good = cat.points > 0;
    html += `<button class="bonus-btn ${good?'good':'bad'}" onclick="openBulkModal('${escapeAttr(cat.name)}', ${cat.points})">
      ${cat.name} ${good?'+':''}${cat.points}
    </button>`;
  });
  html += `</div>`;

  const participation = getNoParticipationSeats(currentClass);
  if(participation.lessonDates.length > 0){
    const dateLabel = participation.lessonDates.slice().reverse().join('、');
    html += `<div class="section-title">🙋 待選名單</div>
    <div class="participation-note">依最近 ${participation.lessonDates.length} 個上課日統計：${dateLabel}</div>`;
    if(participation.seats.length === 0){
      html += `<div class="participation-empty">🎉 大家這幾堂課都有舉手發言！</div>`;
    } else {
      html += `<div class="participation-grid">`;
      participation.seats.forEach(s => {
        html += `<div class="participation-chip" onclick="openStudent(${s.seat}, '${escapeAttr(s.name)}')">
          <div class="seat">${s.seat}</div>
          <div class="name">${s.name}</div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  html += `<div class="toolbar">
    <div class="section-title" style="margin:0;">🧑‍🎓 個人今日分數（基準 ${DAILY_BASELINE} 分）</div>
    <div class="sort-toggle">
      <button class="${sortMode==='seat'?'active':''}" onclick="setSort('seat')">座號</button>
      <button class="${sortMode==='score'?'active':''}" onclick="setSort('score')">排行</button>
    </div>
  </div>`;

  let list = students.map(s => ({...s, score: scoreMap[s.seat] ?? DAILY_BASELINE}));
  if(sortMode === "score"){
    list = list.slice().sort((a,b) => b.score - a.score || a.seat - b.seat);
  } else {
    list = list.slice().sort((a,b) => a.seat - b.seat);
  }

  html += `<div class="student-grid">`;
  list.forEach((s, i) => {
    let medal = "";
    if(sortMode === "score"){
      if(i===0) medal = "🥇"; else if(i===1) medal = "🥈"; else if(i===2) medal = "🥉";
    }
    html += `<div class="student-card" onclick="openStudent(${s.seat}, '${escapeAttr(s.name)}')">
      ${medal ? `<div class="medal">${medal}</div>` : ""}
      <div class="seat-badge">${s.seat}</div>
      <div class="name">${s.name}</div>
      <div><span class="score">${s.score}</span><span class="score-label">分</span></div>
    </div>`;
  });
  html += `</div>`;

  if(students.length === 0){
    html += `<div class="empty">這個班級目前沒有學生名單。</div>`;
  }

  content.innerHTML = html;
}

function setSort(mode){
  sortMode = mode;
  render();
}

function escapeAttr(s){
  return String(s).replace(/'/g, "\\'");
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

function postAction(body){
  // Fire-and-let-caller-await; UI itself never blocks on this (see the
  // optimistic-update functions below) — it only reconciles afterwards.
  return fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(body)
  }).then(res => res.json().catch(() => ({})));
}

// Mirrors the backend's computeClassLevels formula so the UI can jump to
// the right level/progress immediately, before the server round-trip
// confirms it (see class-mgr Apps Script: computeClassLevels).
function levelFromTotal(total, pointsPerLevel, maxLevel){
  const clamped = Math.max(total, 0);
  let levelIndex = Math.floor(clamped / pointsPerLevel);
  if(levelIndex > maxLevel - 1) levelIndex = maxLevel - 1;
  let progress = clamped - levelIndex * pointsPerLevel;
  if(levelIndex >= maxLevel - 1) progress = Math.min(progress, pointsPerLevel);
  return {level: levelIndex + 1, progress};
}

function bumpClassTotal(className, deltaPoints){
  STATE.classLevels = STATE.classLevels || [];
  let cl = STATE.classLevels.find(c => c.className === className);
  if(!cl){
    cl = {className, total:0, level:1, progress:0, pointsPerLevel:20, maxLevel:20};
    STATE.classLevels.push(cl);
  }
  cl.total += deltaPoints;
  const {level, progress} = levelFromTotal(cl.total, cl.pointsPerLevel, cl.maxLevel);
  cl.level = level;
  cl.progress = progress;
}

function bumpStudentScore(className, seat, deltaPoints){
  STATE.scores = STATE.scores || [];
  let s = STATE.scores.find(x => x.className === className && Number(x.seat) === Number(seat));
  if(!s){
    s = {className, seat, score: DAILY_BASELINE};
    STATE.scores.push(s);
  }
  s.score += deltaPoints;
}

function pushOptimisticRecord(className, seat, name, category, points){
  STATE.records = STATE.records || [];
  STATE.records.push({time: new Date().toISOString(), className, seat, name, category, points, note:""});
}

// Reconcile with the server in the background — never blocks the UI, but
// keeps things honest in case of concurrent edits from other devices.
function reconcile(){
  loadState().catch(() => {});
}

function doBulkAdd(category, points, excludedSeats){
  const excluded = excludedSeats || new Set();
  const students = (STATE.students || []).filter(s => s.className === currentClass && !excluded.has(Number(s.seat)));
  students.forEach(s => {
    bumpStudentScore(currentClass, s.seat, points);
    pushOptimisticRecord(currentClass, s.seat, s.name, category, points);
  });
  bumpClassTotal(currentClass, points * students.length);
  render();
  const excludeNote = excluded.size > 0 ? `（已排除 ${excluded.size} 人）` : "";
  showToast(`✅ 全班：${category} ${points>0?'+':''}${points} 分${excludeNote}`);

  postAction({action:"bulkAdd", className: currentClass, category, points, excludeSeats: Array.from(excluded)})
    .then(reconcile)
    .catch(() => {
      showToast("⚠️ 同步失敗，正在重新整理…");
      reconcile();
    });
}

function openBulkModal(category, points){
  bulkModal = {category, points, excluded: new Set()};
  renderBulkModal();
  document.getElementById("modalBackdrop").classList.add("open");
}

function toggleBulkExclude(seat){
  if(!bulkModal) return;
  seat = Number(seat);
  if(bulkModal.excluded.has(seat)) bulkModal.excluded.delete(seat);
  else bulkModal.excluded.add(seat);
  renderBulkModal();
}

function bulkIncludeAll(){
  if(!bulkModal) return;
  bulkModal.excluded.clear();
  renderBulkModal();
}

function bulkExcludeAll(){
  if(!bulkModal) return;
  const students = (STATE.students || []).filter(s => s.className === currentClass);
  students.forEach(s => bulkModal.excluded.add(Number(s.seat)));
  renderBulkModal();
}

function confirmBulkAdd(){
  if(!bulkModal) return;
  const {category, points, excluded} = bulkModal;
  closeModal();
  doBulkAdd(category, points, excluded);
}

function renderBulkModal(){
  if(!bulkModal) return;
  const {category, points, excluded} = bulkModal;
  const good = points > 0;
  const students = (STATE.students || []).filter(s => s.className === currentClass).slice().sort((a,b) => a.seat - b.seat);
  const includedCount = students.length - excluded.size;

  let html = `<div class="modal-head">
    <h2>全班加減分：${category} ${good?'+':''}${points}</h2>
    <button class="close-btn" onclick="closeModal()">✕</button>
  </div>
  <div class="bulk-hint">點選座號可排除該同學，不加不減分。目前將套用於 ${includedCount} / ${students.length} 位同學。</div>
  <div class="bulk-toolbar">
    <button onclick="bulkIncludeAll()">全部包含</button>
    <button onclick="bulkExcludeAll()">全部排除</button>
  </div>
  <div class="exclude-grid">`;
  students.forEach(s => {
    const isExcluded = excluded.has(Number(s.seat));
    html += `<div class="exclude-chip ${isExcluded?'excluded':''}" onclick="toggleBulkExclude(${s.seat})">
      <div class="seat">${s.seat}</div>
      <div class="name">${s.name}</div>
    </div>`;
  });
  html += `</div>
  <div class="bulk-confirm-row">
    <button class="cancel-btn" onclick="closeModal()">取消</button>
    <button class="apply-btn" onclick="confirmBulkAdd()">套用（${includedCount} 人）</button>
  </div>`;

  document.getElementById("modalBody").innerHTML = html;
}

function openStudent(seat, name){
  modalStudent = {seat, name};
  renderModal();
  document.getElementById("modalBackdrop").classList.add("open");
}

function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("open");
  modalStudent = null;
  bulkModal = null;
}

function renderModal(){
  if(!modalStudent) return;
  const {seat, name} = modalStudent;
  const scoreEntry = (STATE.scores || []).find(s => s.className === currentClass && s.seat === seat);
  const score = scoreEntry ? scoreEntry.score : DAILY_BASELINE;
  const categories = STATE.categories || [];
  const today = todayStr();
  const records = (STATE.records || []).filter(r =>
    r.className === currentClass && Number(r.seat) === Number(seat) && dateKeyTaipei(r.time) === today
  ).sort((a,b) => new Date(b.time) - new Date(a.time));

  let html = `<div class="modal-head">
    <h2>${name}（座號 ${seat}）</h2>
    <button class="close-btn" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-score"><span class="num">${score}</span> 分（今日）</div>
  <div class="cat-grid">`;
  categories.forEach(cat => {
    const good = cat.points > 0;
    html += `<button class="cat-btn ${good?'good':'bad'}" onclick="doIndividual(${seat}, '${escapeAttr(name)}', '${escapeAttr(cat.name)}', ${cat.points})">
      <span>${cat.name}</span><span class="pts">${good?'+':''}${cat.points}</span>
    </button>`;
  });
  html += `</div>
  <div class="history-list">
    <h3>今日紀錄</h3>`;
  if(records.length === 0){
    html += `<div class="history-empty">今天還沒有加減分紀錄。</div>`;
  } else {
    records.forEach(r => {
      const t = new Date(r.time);
      const hh = String(t.getHours()).padStart(2,"0");
      const mm = String(t.getMinutes()).padStart(2,"0");
      const good = r.points > 0;
      html += `<div class="history-item">
        <span class="cat">${hh}:${mm} ${r.category}</span>
        <span class="pt ${good?'good':'bad'}">${good?'+':''}${r.points}</span>
      </div>`;
    });
  }
  html += `</div>`;

  document.getElementById("modalBody").innerHTML = html;
}

function doIndividual(seat, name, category, points){
  if(category === PARTICIPATION_CATEGORY){
    const today = todayStr();
    const already = (STATE.records || []).some(r =>
      r.className === currentClass && Number(r.seat) === Number(seat) &&
      r.category === PARTICIPATION_CATEGORY && dateKeyTaipei(r.time) === today
    );
    if(already){
      showToast(`🙋 ${name} 今天已經加過「${PARTICIPATION_CATEGORY}」了`);
      return;
    }
  }
  bumpStudentScore(currentClass, seat, points);
  pushOptimisticRecord(currentClass, seat, name, category, points);
  bumpClassTotal(currentClass, points);
  render();
  if(modalStudent && modalStudent.seat === seat){
    renderModal();
  }
  showToast(`✅ ${name} ${category} ${points>0?'+':''}${points} 分`);

  postAction({className: currentClass, seat, name, category, points, note:""})
    .then(reconcile)
    .catch(() => {
      showToast("⚠️ 同步失敗，正在重新整理…");
      reconcile();
    });
}

document.getElementById("modalBackdrop").addEventListener("click", (e) => {
  if(e.target.id === "modalBackdrop") closeModal();
});

loadState();
setInterval(loadState, 30000);
</script>
